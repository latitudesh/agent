# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lsh-agent

builds:
  - id: lsh-agent
    main: ./cmd/agent
    binary: lsh-agent
    env:
      # Static binary: one .deb runs on every supported Debian/Ubuntu release.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

nfpms:
  - id: lsh-agent
    package_name: lsh-agent
    # lsh-agent_<version>_<arch>.deb and lsh-agent-<version>-1.<arch>.rpm, each
    # format's own naming convention.
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Latitude.sh
    homepage: https://github.com/latitudesh/agent
    maintainer: Latitude.sh <support@latitude.sh>
    description: |-
      Latitude.sh Agent
      Keeps the server's UFW firewall in sync with the Latitude.sh Firewall
      configured in the dashboard.
    license: GPL-3.0-only
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: admin
    priority: optional
    contents:
      # Modes set here, not taken from the checkout (a umask of 002 would ship
      # group-writable files owned by root).
      - src: packaging/lsh-agent.service
        dst: /usr/lib/systemd/system/lsh-agent.service
        file_info:
          mode: 0644
      - src: configs/agent.yaml
        dst: /etc/lsh-agent/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
    # The same files and lifecycle in both formats; only the dependencies and
    # the maintainer scripts differ (dpkg passes action names, RPM counts).
    overrides:
      deb:
        dependencies:
          - ufw
          # deb-systemd-helper / deb-systemd-invoke, used by the maintainer scripts.
          - init-system-helpers
        scripts:
          postinstall: packaging/scripts/postinst
          preremove: packaging/scripts/prerm
          postremove: packaging/scripts/postrm
      rpm:
        dependencies:
          # From EPEL on the RHEL family (install.sh enables it).
          - ufw
          - systemd
        scripts:
          postinstall: packaging/scripts/rpm/post
          preremove: packaging/scripts/rpm/preun
          postremove: packaging/scripts/rpm/postun
    rpm:
      group: Applications/System
      summary: Latitude.sh Agent

# One SPDX SBOM per package (<package file>.sbom.json), uploaded
# with the release. Needs syft on PATH (release.yml and ci.yml install it).
sboms:
  - id: packages
    artifacts: package

snapshot:
  # 1.0.3-dev becomes 1.0.3~dev in the packages, which sorts below the 1.0.3
  # release in both dpkg and RPM.
  version_template: "{{ incpatch .Version }}-dev"

release:
  # Releases are usually published from the GitHub UI: keep the notes written
  # there, and let a re-run of the workflow re-upload the artifacts.
  mode: keep-existing
  replace_existing_artifacts: true
