name: scheduled-scan

# ci.yml only checks the code of each PR. This runs once a week against main
# and against the binaries of the latest published release, so a Go standard
# library or module vulnerability published after a release is found even when
# nobody is touching the repo. Findings go to one tracking issue, updated while
# they last and closed by the first clean scan. If the SLACK_WEBHOOK_SCAN secret
# is set, each change of state is also posted to Slack.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 UTC-4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # govulncheck exits 3 when it finds a vulnerability; anything else
      # non-zero means the scan itself failed.
      - name: govulncheck
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          gv="$(go env GOPATH)/bin/govulncheck"
          rows="$RUNNER_TEMP/rows"
          : >"$rows"
          failed=0

          scan() { # <label> <govulncheck args...>
            local label=$1 rc=0
            shift
            "$gv" "$@" >"$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
            case $rc in
              0) echo "| $label | clean |" >>"$rows" ;;
              3) echo "| $label | vulnerabilities found |" >>"$rows" ;;
              *) echo "| $label | scan failed (exit $rc) |" >>"$rows"; failed=1 ;;
            esac
            {
              echo "::group::$label"
              cat "$RUNNER_TEMP/out.txt"
              echo "::endgroup::"
            }
          }

          scan "source (main)" ./...

          if tag="$(gh release view --json tagName --jq .tagName)"; then
            mkdir -p "$RUNNER_TEMP/debs"
            gh release download "$tag" --pattern '*.deb' --dir "$RUNNER_TEMP/debs"
            for deb in "$RUNNER_TEMP"/debs/*.deb; do
              dir="$RUNNER_TEMP/x/$(basename "$deb" .deb)"
              mkdir -p "$dir"
              dpkg-deb -x "$deb" "$dir"
              scan "binary $(basename "$deb")" -mode=binary "$dir/usr/bin/lsh-agent"
            done
          else
            echo "| latest release | not found |" >>"$rows"
            failed=1
          fi

          {
            echo "| Target | Result |"
            echo "|---|---|"
            cat "$rows"
          } >"$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >>"$GITHUB_OUTPUT"

      - name: Update the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled scan: vulnerabilities in the agent"
          FAILED: ${{ steps.scan.outputs.failed }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE))[0].number // empty")"
          if grep -q '| vulnerabilities found |$' "$RUNNER_TEMP/rows"; then
            {
              echo "The weekly govulncheck scan found vulnerabilities the agent's code can reach. Details per target: $RUN_URL"
              echo
              cat "$RUNNER_TEMP/report.md"
              echo
              echo "A finding in a released binary is usually fixed by a new release built with the current Go toolchain; a finding in main needs a module bump. This issue is updated by every scan and closed by the first clean one."
            } >"$RUNNER_TEMP/body.md"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            else
              issue="$(gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" | grep -oE '[0-9]+$')"
            fi
            state=open
          # Close only on a complete scan.
          elif [ -n "$issue" ] && [ "$FAILED" = "0" ]; then
            gh issue close "$issue" --comment "Clean as of $RUN_URL."
            state=closed
          else
            state=none
          fi
          {
            echo "state=$state"
            [ -z "$issue" ] || echo "url=$(gh issue view "$issue" --json url --jq .url)"
          } >>"$GITHUB_OUTPUT"

      # Optional: skipped until the SLACK_WEBHOOK_SCAN secret exists. Never
      # fails the job; the issue is the record.
      - name: Notify Slack
        if: steps.issue.outputs.state == 'open' || steps.issue.outputs.state == 'closed'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_SCAN }}
          STATE: ${{ steps.issue.outputs.state }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_SCAN is not set, skipping the Slack notification"
            exit 0
          fi
          if [ "$STATE" = open ]; then
            text="lsh-agent weekly scan: govulncheck found vulnerabilities. Issue: $ISSUE_URL"
          else
            text="lsh-agent weekly scan: clean again, closed $ISSUE_URL"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK" >/dev/null ||
            echo "::warning::Slack notification failed"

      - name: Fail if a scan could not run
        if: steps.scan.outputs.failed != '0'
        run: exit 1
