name: pr-checks

# Every PR, forks included: secrets in what it adds, and the workflows
# themselves. Runs with a read-only token and no repository secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secrets (betterleaks, TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commits this PR adds, merges included (diffed against their first
      # parent), then the resulting tree.
      # generic-password is off: it flags the placeholder passwords in tests and
      # docs, and gitleaks (which this replaces) had no such rule.
      # Exit 3 = a finding; any other non-zero is a scan error, and both fail.
      - name: betterleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BETTERLEAKS: ghcr.io/betterleaks/betterleaks:v1.10.1@sha256:f345c1ac502abc51ec334c3d815ad18a79fb1509555fc4496b2cb88e760681b3
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$BETTERLEAKS" \
            git --no-banner --redact --disable-rule generic-password --exit-code 3 --log-opts="--diff-merges=first-parent ${BASE_SHA}..HEAD" .
          docker run --rm -v "$PWD:/repo" -w /repo "$BETTERLEAKS" \
            dir --no-banner --redact --disable-rule generic-password --exit-code 3 .

      # Second opinion on the same commits: TruffleHog checks each candidate
      # against its provider, so it reports live credentials (verified) and the
      # ones it could not check (unknown), not every high-entropy string.
      # Exit 183 = a finding; any other non-zero is a scan error, and both fail.
      - name: TruffleHog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUFFLEHOG: trufflesecurity/trufflehog:3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRUFFLEHOG" \
            git file:///repo --since-commit "$BASE_SHA" --branch HEAD \
            --results=verified,unknown --fail --no-update

  workflows:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --offline --format github /repo/.github

  claude-local:
    name: Claude Code local files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Per-user Claude Code files must never be committed: settings.local.json
      # keeps "don't ask again" approvals as whole command lines, and passwords
      # passed on a command line (sshpass -p, mysql -p, ...) have no provider
      # format, so gitleaks and TruffleHog miss them. Fail on the file names
      # instead, in any commit the PR adds and in the resulting tree.
      - name: No Claude Code local files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          re='(^|/)\.claude/(.*/)?[^/]*\.local\.[^/]+$|(^|/)CLAUDE\.local\.md$|(^|/)\.claude/worktrees(/|$)'
          # NUL-separated so git never quotes a path; a git error fails the step.
          git log -z --diff-merges=first-parent --no-renames --diff-filter=A --name-only --format= \
            "${BASE_SHA}..HEAD" > "$RUNNER_TEMP/added"
          git ls-files -z > "$RUNNER_TEMP/tracked"
          rc=0
          found="$(cat "$RUNNER_TEMP/added" "$RUNNER_TEMP/tracked" | grep -zE "$re" | sort -zu | tr '\0' '\n')" || rc=$?
          # grep exits 1 when nothing matches; anything above that is a real error.
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          if [ -n "$found" ]; then
            while IFS= read -r f; do echo "::error::Claude Code local file committed: $f"; done <<< "$found"
            echo "Remove it from the PR (rewrite the commits that added it) and rotate any credential it held."
            exit 1
          fi
